name: upload-assets
on:
  push:
    branches: [upload-assets]
permissions:
  contents: write
  actions: read
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44071140659 -R 1hei1/browser-kernel -n mz-kernel -D k
          ls -l k; sha256sum k/*; unzip -p k/*.zip chrome.dll 2>/dev/null | sha256sum || true
          gh release upload v158.0.8127.37-mz5 k/* -R 1hei1/browser-kernel --clobber
