name: upload-assets
on:
  push:
    branches: [upload-assets]
permissions:
  contents: write
  actions: read
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44245758407 -R 1hei1/browser-kernel -n mz-kernel -D k
          ls -l k; unzip -l k/*.zip | grep chrome.dll; f=$(unzip -Z1 k/*.zip | grep "chrome.dll$" | head -1); unzip -p k/*.zip "$f" | sha256sum; unzip -p k/*.zip "$f" | wc -c; cat k/SHA256SUMS.txt
          gh release upload v158.0.8127.37-mz7 k/* -R 1hei1/browser-kernel --clobber
