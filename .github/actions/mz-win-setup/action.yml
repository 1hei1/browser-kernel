name: MZ Windows build setup
description: Pick the work drive, speed up the runner, install Python/uv and Windows SDK 10.0.28000
runs:
  using: composite
  steps:
    - name: Job clock, work dir, runner tuning
      shell: pwsh
      run: |
        "MZ_JOB_START=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
        # Same choice on every job, because ninja files hold absolute paths.
        if (Test-Path 'D:\') { $work = 'D:\mzb' } else { $work = 'C:\mzb' }
        "MZ_WORK=$work" >> $env:GITHUB_ENV
        New-Item -ItemType Directory -Force -Path $work | Out-Null
        Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}
        Write-Host "CPU cores: $env:NUMBER_OF_PROCESSORS"
        try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop } catch { Write-Host "Defender: $_" }
        try { Add-MpPreference -ExclusionPath $work -ErrorAction Stop } catch { Write-Host "Defender exclusion: $_" }
        git config --system core.longpaths true
        git config --global core.autocrlf false
        git config --global core.filemode false
        git config --global user.name mz-ci
        git config --global user.email mz-ci@users.noreply.github.com
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install uv
      shell: pwsh
      run: python -m pip install --quiet uv
    - name: Install Windows SDK 10.0.28000.0 (Chromium 157/158 require it)
      shell: pwsh
      run: |
        if (Test-Path 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.28000.0') {
          Write-Host 'SDK 10.0.28000.0 already installed.'
        } else {
          $installer = "$env:TEMP\winsdksetup.exe"
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/38ab8f6d-3676-4860-ae84-3361308b9d7f/KIT_BUNDLE_WINDOWSSDK_MEDIACREATION/winsdksetup.exe' -OutFile $installer
          $features = '/features OptionId.DesktopCPPx64 OptionId.DesktopCPPx86 OptionId.DesktopCPPArm64 OptionId.WindowsDesktopDebuggers OptionId.UWPCPP OptionId.SigningTools /q /norestart /ceip off'
          $proc = Start-Process -FilePath $installer -ArgumentList $features -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "winsdksetup.exe failed with code $($proc.ExitCode)" }
          if (-not (Test-Path 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.28000.0')) { throw 'SDK 10.0.28000.0 not found after install.' }
        }
